  <base href="/">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Aplica o tema escolhido antes do paint para evitar flash (FOUC).
    // Sem escolha persistida → cai no @media prefers-color-scheme (CSS).
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (_) { /* localStorage indisponível (privacy/iframe) — segue SO */ }
    })();
  </script>
